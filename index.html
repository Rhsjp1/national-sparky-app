<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National SparkySolve AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a1a; font-family: sans-serif; }
        .chat-container { height: calc(100vh - 220px); }
    </style>
</head>
<body class="flex flex-col max-w-md mx-auto min-h-screen bg-zinc-900 text-zinc-100">
    <header class="bg-yellow-400 text-black p-4 shadow-lg border-b-4 border-yellow-600 text-center">
        <h1 class="text-xl font-black uppercase tracking-widest">⚡ National SparkySolve</h1>
        <div class="mt-1 text-xs font-bold bg-zinc-900 text-yellow-400 px-2 py-1 rounded inline-block">
            Free Credits: <span id="credit-count">5</span>/5
        </div>
    </header>

    <div id="chat-box" class="chat-container overflow-y-auto p-4 space-y-4">
        <div class="bg-zinc-800 p-4 rounded-lg border-l-4 border-yellow-400">
            <p class="font-bold text-yellow-400 text-sm">USA NATIONAL STANDARD</p>
            <p class="text-sm mt-1">Providing low-token NEC troubleshooting, parts, and estimated costs.</p>
        </div>
    </div>

    <div id="tier-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50">
        <div class="bg-zinc-800 border-2 border-yellow-400 p-6 rounded-xl text-center max-w-xs">
            <span class="text-4xl">🔒</span>
            <h2 class="text-lg font-black text-yellow-400 uppercase mt-2">Limit Reached</h2>
            <p class="text-xs text-zinc-300 mt-2">You have used your 5 free national tokens.</p>
            <div class="bg-zinc-900 p-3 rounded my-4 border border-zinc-700">
                <p class="text-xl font-bold text-white">$19/mo</p>
                <p class="text-[10px] text-zinc-400">Unlimited nationwide field diagnostics</p>
            </div>
            <button onclick="alert('Link payment gateway here!')" class="w-full bg-yellow-400 text-black py-2 rounded font-bold uppercase text-sm">Upgrade to Pro</button>
        </div>
    </div>

    <div class="p-4 bg-zinc-800 border-t border-zinc-700 sticky bottom-0">
        <div class="flex flex-col gap-3">
            <div class="flex gap-2">
                <button id="mic-btn" onclick="startListening()" class="bg-red-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-2 border-red-800 active:scale-90 transition-all">
                    <span id="mic-icon" style="font-size: 24px;">🎙️</span>
                </button>
                <textarea id="user-input" placeholder="Speak or type code issue..." class="flex-1 bg-zinc-900 border border-zinc-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none text-sm" rows="1"></textarea>
            </div>
            <button onclick="askAI()" class="bg-yellow-400 text-black py-3 rounded-lg font-black uppercase hover:bg-yellow-300 transition-all">Get Solution</button>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE STUDIO KEY HERE
        const API_KEY = 'AIzaSyAyc_UmpJcNq3gQiz3cRX_qf1OVUzC2CXk';
        const input = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const creditCountDisplay = document.getElementById('credit-count');
        const tierModal = document.getElementById('tier-modal');

        let savedCredits = localStorage.getItem('sparky_credits_national');
        let credits = savedCredits !== null ? parseInt(savedCredits) : 5;
        creditCountDisplay.innerText = credits;

        function startListening() {
            if (credits <= 0) { tierModal.classList.remove('hidden'); return; }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Use Chrome browser on your Chromebook."); return; }
            const recognition = new SpeechRecognition();
            recognition.start();
            micBtn.classList.add('animate-pulse', 'bg-red-400');
            micIcon.innerText = "🛑";
            recognition.onresult = (e) => {
                input.value = e.results[0][0].transcript;
                micBtn.classList.remove('animate-pulse', 'bg-red-400');
                micIcon.innerText = "🎙️";
            };
            recognition.onerror = () => {
                micBtn.classList.remove('animate-pulse', 'bg-red-400');
                micIcon.innerText = "🎙️";
            };
        }

        async function askAI() {
            if (credits <= 0) { tierModal.classList.remove('hidden'); return; }
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;

            const userText = input.value;
            chatBox.innerHTML += `<div class="bg-zinc-700 p-3 rounded-lg text-sm self-end ml-8 border border-zinc-500">${userText}</div>`;
            
            const loadingId = Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="text-yellow-400 text-xs animate-pulse font-bold uppercase">Checking NEC...</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        // SHORT PROMPT LENGTH SAVES TOKENS/COST
                        contents: [{ parts: [{ text: "NEC Expert: Give fix, short supply list, and cost for: " + userText }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-zinc-800 p-4 rounded-lg text-sm border-l-4 border-yellow-400 shadow-md prose prose-invert">${aiText.replace(/\n/g, '<br>')}</div>`;
                
                credits--;
                localStorage.setItem('sparky_credits_national', credits);
                creditCountDisplay.innerText = credits;

            } catch (error) {
                document.getElementById(loadingId).innerText = "ERROR. CHECK KEY.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
