<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>RHS Electrical OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #0f1117; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body class="flex flex-col min-h-screen bg-black text-zinc-100">

<header id="app-header" class="bg-yellow-400 text-black p-4 shadow-xl border-b-4 border-yellow-600 sticky top-0 z-40" style="display: none;">
<div class="flex justify-between items-center">
<div>
<h1 class="text-sm font-black uppercase tracking-wider">⚡ RHS ELECTRICAL OS</h1>
<p class="text-[10px] font-bold tracking-tight bg-black text-yellow-400 px-1 py-0.5 rounded inline-block mt-0.5">NC STATE COMPLIANT</p>
</div>
<div class="text-right space-x-2">
<span id="usage-pill" class="text-[10px] bg-black text-yellow-400 px-2 py-1 rounded font-mono font-bold hidden"></span>
<span id="gps-status" class="text-[10px] bg-zinc-900 text-yellow-400 px-2 py-1 rounded font-mono font-bold">GPS OFF</span>
<button onclick="doLogout()" class="text-[10px] bg-black text-yellow-400 px-2 py-1 rounded uppercase font-bold hover:bg-yellow-600">Logout</button>
</div>
</div>
</header>

<nav id="main-nav" class="flex bg-zinc-900 text-xs font-bold uppercase border-b border-zinc-800" style="display: none;">
<button onclick="switchTab('dispatch')" class="flex-1 py-3 text-center text-yellow-400 border-b-2 border-yellow-400">Dispatch</button>
<button onclick="switchTab('diagnostic')" class="flex-1 py-3 text-center text-zinc-400">AI Diagnostic</button>
<button onclick="switchTab('history')" class="flex-1 py-3 text-center text-zinc-400">Logs</button>
<button onclick="switchTab('settings')" class="flex-1 py-3 text-center text-zinc-400">Settings</button>
</nav>

<main class="flex-1 p-3 space-y-3 overflow-y-auto">

<section id="auth-gate" class="tab-content active space-y-3">
<div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800">
<h2 class="text-lg font-black text-yellow-400 mb-2">Authentication Required</h2>
<p class="text-xs text-zinc-400 mb-4">Sign in with GitHub to access NC Sparky suite.</p>
<div id="auth-errors" class="text-xs text-red-400 mb-2 hidden"></div>
<button onclick="signInWithGitHub()" class="w-full bg-yellow-400 text-black font-black uppercase py-3 rounded hover:bg-yellow-500">Sign in with GitHub</button>
<p class="text-[10px] text-zinc-500 mt-2">Auth via Supabase Auth · 5 free diagnostics/month.</p>
</div>
</section>

<section id="tab-login" class="tab-content space-y-3">
<div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800">
<h2 class="text-lg font-black text-yellow-400 mb-2">Sign in</h2>
<button onclick="signInWithGitHub()" class="w-full bg-yellow-400 text-black font-black uppercase py-3 rounded hover:bg-yellow-500">GitHub</button>
</div>
</section>

<section id="tab-dispatch" class="tab-content space-y-3"></section>
<section id="tab-diagnostic" class="tab-content space-y-3"></section>
<section id="tab-history" class="tab-content space-y-3"></section>
<section id="tab-settings" class="tab-content space-y-3"></section>

</main>

<script>
(function() {
  "use strict";

  // Read Supabase config JSON
  const cfgEl = document.getElementById("supabase-config");
  const cfg = JSON.parse(cfgEl.textContent);

  const supabase = window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_ANON_KEY,
    { autoRefreshToken: true, persistSession: true }
  );

  const state = {
    user: null,
    profile: null,
    usage: 0,
    usageLimit: 5,
    gpsWatching: false,
    gpsWatchId: null
  };

  const APP_URL = window.location.origin;

  function qs(id) {
    return document.getElementById(id);
  }

  function dataLength(data) {
    return Array.isArray(data) ? data.length : 0;
  }

  function esc(s) {
    if (typeof s !== "string") return "";
    return s.replace(/[&<>\\"]/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\\\"": "&quot;" }[c]
    ));
  }

  function updateHeader() {
    const pill = qs("usage-pill");
    if (!pill) return;
    pill.textContent = "DIAG: " + state.usage + "/" +
      (state.usageLimit === Infinity ? "∞" : state.usageLimit);
    pill.classList.toggle("hidden", !state.user);
  }

  function switchTab(name) {
    ["dispatch","diagnostic","history","settings"].forEach(t => {
      const el = qs("tab-" + t);
      if (el) el.classList.toggle("active", t === name);
    });
    if (name === "diagnostic") renderDiagnostic();
    if (name === "dispatch") drawDispatch();
    if (name === "history") loadLogs();
  }

  async function ensureProfile() {
    if (state.profile) return;
    const { data } = await supabase
      .from("user_profiles")
      .select("*")
      .eq("id", state.user.id)
      .single();
    state.profile = data || { id: state.user.id, tier: "free" };
  }

  async function refreshUsage() {
    if (!state.user) return;
    const { row_count } = await supabase
      .rpc("count_user_usage_30d", { uid: state.user.id })
      .catch(() => ({ row_count: 0 }));
    state.usage = row_count || 0;
    state.usageLimit =
      state.profile?.tier === "free" || !state.profile?.tier ? 5 : Infinity;
    updateHeader();
  }

  async function loadLogs() {
    if (!state.user) return;
    const { data } = await supabase
      .from("diagnostic_logs")
      .select("*")
      .eq("user_id", state.user.id)
      .order("created_at", { ascending: false })
      .limit(50);
    const inner = dataLength(data)
      ? data.map(r => `
        <div class="mb-3 border-b border-zinc-800 pb-2">
          <p class="text-xs text-yellow-400 font-bold">
            ${esc(r.title || "Diagnostic")}
          </p>
          <p class="text-[10px] text-zinc-400">
            ${esc(r.summary || "")}
          </p>
        </div>
      `).join("")
      : '<p class="text-[10px] text-zinc-500">No diagnostics yet.</p>';
    const wrap = qs("tab-history");
    if (wrap) {
      wrap.innerHTML = `
        <div class="bg-zinc-900 p-3 rounded border border-zinc-800">
          ${inner}
        </div>
      `;
    }
  }

  async function loadClients() {
    if (!state.user) return;
    const { data } = await supabase
      .from("clients")
      .select("*")
      .eq("user_id", state.user.id)
      .order("created_at", { ascending: false })
      .limit(50);
    const wrap = qs("tab-dispatch");
    if (!wrap) return;
    wrap.innerHTML = dataLength(data)
      ? data.map(c => `
        <div class="bg-zinc-900 p-3 rounded border border-zinc-800">
          <div class="flex justify-between">
            <div>
              <h3 class="text-xs font-bold text-yellow-400">
                ${esc(c.name || "Client")}
              </h3>
              <p class="text-[10px] text-zinc-400">
                ${esc(c.address || "")}
              </p>
            </div>
            <button class="text-[10px] text-red-400"
                    onclick="deleteClient(${c.id})">
              Delete
            </button>
          </div>
        </div>
      `).join("")
      : '<p class="text-[10px] text-zinc-500">No clients yet.</p>';
  }

  async function postAuthUI() {
    const has = !!state.user;

    const header = qs("app-header");
    const nav = qs("main-nav");
    if (header) header.style.display = has ? "" : "none";
    if (nav) nav.style.display = has ? "" : "none";

    const gate = qs("auth-gate");
    if (gate) gate.style.display = has ? "none" : "";

    const login = qs("tab-login");
    if (login) login.style.display = has ? "none" : "";

    if (has) {
      switchTab("dispatch");
      await loadClients();
    } else {
      ["dispatch","diagnostic","history"].forEach(t => {
        const el = qs("tab-" + t);
        if (el) el.innerHTML = "";
      });
      switchTab("login");
    }
  }

  // GitHub sign-in handler used by the button
  window.signInWithGitHub = async function signInWithGitHub() {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "github",
      options: { redirectTo: APP_URL }
    });
    if (error) console.error(error);
  };

  // Logout handler
  window.doLogout = async function doLogout() {
    await supabase.auth.signOut();
  };

  // Client creation
  window.addClient = async function addClient() {
    if (!state.user) return;
    const name = qs("client-name")?.value || null;
    const address = qs("client-address")?.value || null;
    const phone = qs("client-phone")?.value || null;
    const notes = qs("client-notes")?.value || null;
    const { error } = await supabase
      .from("clients")
      .insert({ user_id: state.user.id, name, address, phone, notes });
    if (error) {
      alert("Failed to add client.");
      return;
    }
    await loadClients();
    if (qs("client-name")) qs("client-name").value = "";
    if (qs("client-address")) qs("client-address").value = "";
    if (qs("client-phone")) qs("client-phone").value = "";
    if (qs("client-notes")) qs("client-notes").value = "";
    alert("Client saved.");
  };

  // Client deletion handler
  window.deleteClient = async function(id) {
    if (!confirm("Delete?")) return;
    await supabase.from("clients").delete().eq("id", id);
    await loadClients();
  };

  async function renderDiagnostic() {
    if (!state.user) return;
    const panel = qs("tab-diagnostic");
    if (!panel) return;
    panel.innerHTML = `
      <div class="space-y-3">
        <div class="bg-zinc-900 p-3 rounded border border-zinc-800">
          <label class="text-[10px] font-black text-yellow-400 uppercase">
            NC Code Question
          </label>
          <textarea id="diag-prompt"
                    class="w-full bg-black text-xs text-zinc-100 mt-2 p-2 rounded border border-zinc-800"
                    rows="4"></textarea>
          <div class="flex space-x-2 mt-2">
            <button onclick="runDiagnose('text')"
                    class="flex-1 bg-yellow-400 text-black text-[11px] font-black py-2 rounded">
              Text Only
            </button>
          </div>
          <p id="diag-result"
             class="text-[10px] text-zinc-400 mt-2 whitespace-pre-wrap"></p>
        </div>
      </div>
    `;
  }

  window.runDiagnose = async function(mode) {
    const result = qs("diag-result");
    if (!result) return;
    result.textContent = "Running...";

    try {
      let body = {};
      if (mode === "text") {
        body.prompt = qs("diag-prompt")?.value || "";
      }

      const { data } = await supabase.auth.getSession();
      const token = data.session?.access_token;
      if (!token) {
        result.textContent = "Auth required. Refresh.";
        return;
      }

      const res = await fetch("/api/diagnose", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const json = await res.json().catch(() => ({ error: "Invalid JSON" }));
      if (res.status === 402) {
        result.textContent = json.error;
        return;
      }
      if (!res.ok) {
        result.textContent = json.error || "Error.";
        return;
      }

      result.innerHTML =
        '<div class="bg-zinc-900 p-3 rounded border border-yellow-600 mt-2">' +
        '<p class="text-xs text-yellow-400 mb-1">Result:</p>' +
        '<p class="text-xs whitespace-pre-wrap">' +
        esc(json.result || JSON.stringify(json, null, 2)) +
        "</p></div>";

      await refreshUsage();
      await loadLogs();
    } catch (err) {
      result.textContent = "Network error.";
      console.error(err);
    }
  };

  supabase.auth.onAuthStateChange((ev, sess) => {
    if (ev === "SIGNED_IN" || ev === "TOKEN_REFRESHED") {
      if (sess?.user) {
        state.user = sess.user;
        ensureProfile()
          .then(() => refreshUsage())
          .then(() => postAuthUI());
      }
    }
    if (ev === "SIGNED_OUT") {
      state.user = null;
      postAuthUI();
    }
  });

  if (new URLSearchParams(window.location.search).get("upgrade") === "success") {
    switchTab("settings");
    alert("Subscription active. Tier will update shortly.");
  }

  async function handleAuth() {
    const { data, error } = await supabase.auth.getSession();
    if (error) {
      console.error(error);
      return;
    }
    if (data?.session?.user) {
      state.user = data.session.user;
      await ensureProfile();
      await refreshUsage();
      await postAuthUI();
    }
  }

  handleAuth();
})();
</script>
