<!DOCTYPE html>
<html lang="en" class="h-full bg-[#030712] text-slate-100 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalAI Enterprise Engine</title>
    <link class="favicon" rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        .leaflet-container { background: #090d1a !important; border: none; }
    </style>
</head>
<body class="h-full bg-[#030712] text-slate-100 font-sans antialiased select-none overflow-hidden flex flex-col">

    <header class="bg-[#090d1a] border-b border-slate-900/60 h-14 px-4 sm:px-6 flex items-center justify-between shrink-0 z-10 shadow-lg">
        <div class="flex items-center space-x-2.5">
            <div class="h-8 w-8 bg-indigo-600/10 rounded-lg border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-bolt text-md animate-pulse"></i>
            </div>
            <div>
                <span class="font-bold text-sm tracking-tight text-slate-200">ElectricalAI</span>
                <span class="text-[9px] font-mono block text-slate-500 tracking-wider -mt-0.5">ENGINE PLATFORM v1.0.4</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="supabase-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-amber-500/10 text-amber-400 border border-amber-500/20">
                <span class="h-1.5 w-1.5 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span> Offline Mode
            </span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24" id="panel-surface"></main>

    <nav class="fixed bottom-0 left-0 right-0 h-16 bg-[#090d1a] border-t border-slate-900/80 px-2 flex items-center justify-around z-40 max-w-5xl mx-auto sm:rounded-t-2xl shadow-2xl">
        <button data-nav="jobs" class="nav-tab-btn flex flex-col items-center justify-center flex-1 h-full text-slate-500 hover:text-slate-300 transition-all cursor-pointer">
            <i class="fa-solid fa-briefcase text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Jobs</span>
        </button>
        <button data-nav="active" class="nav-tab-btn flex flex-col items-center justify-center flex-1 h-full text-slate-500 hover:text-slate-300 transition-all cursor-pointer">
            <i class="fa-solid fa-bolt-lightning text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Active</span>
        </button>
        <button data-nav="clients" class="nav-tab-btn flex flex-col items-center justify-center flex-1 h-full text-slate-500 hover:text-slate-300 transition-all cursor-pointer">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Clients</span>
        </button>
        <button data-nav="settings" class="nav-tab-btn flex flex-col items-center justify-center flex-1 h-full text-slate-500 hover:text-slate-300 transition-all cursor-pointer">
            <i class="fa-solid fa-gear text-lg"></i>
            <span class="text-[10px] font-semibold mt-1">Settings</span>
        </button>
    </nav>

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        const ELECTRICAL_CATALOG = [
            { id: 'part-1', name: '20A Single Pole Breaker', price: 14.50 },
            { id: 'part-2', name: '15A Duplex Receptacle', price: 2.75 }
        ];

        let currentTab = 'settings';
        let currentActiveSubTab = 'diagnostics';
        let jobsList = [];
        let selectedActiveJobIndex = null;
        let supabaseClient = null;

        let preferencesState = {
            supabaseUrl: '',
            supabaseKey: '',
            tenantScope: 'lead-alpha',
            fullName: 'James Person II',
            organization: 'Pro Volt Electric',
            phone: '(919) 555-0199',
            email: 'contact@provoltelectric.com',
            address: '1200 Voltage Way, Raleigh NC',
            hourlyRate: 85,
            assistantTone: 'professional',
            voiceFeedback: true,
            highContrastMode: true,
            queriesUsed: 0
        };

        function initSupabase() {
            const indicator = document.getElementById('supabase-status');
            if (preferencesState.supabaseUrl && preferencesState.supabaseKey) {
                try {
                    supabaseClient = supabase.createClient(preferencesState.supabaseUrl, preferencesState.supabaseKey);
                    if (indicator) {
                        indicator.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                        indicator.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Cloud Active`;
                    }
                } catch (e) { console.error(e); }
            } else if (indicator) {
                indicator.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-amber-500/10 text-amber-400 border border-amber-500/20";
                indicator.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span> Local Cache`;
            }
        }

        async function saveJob(job) {
            if (supabaseClient) {
                const payload = {
                    customer_name: job.name,
                    phone: job.phone,
                    address: job.address,
                    type: job.type,
                    safety_checklist: job.safetyChecklist,
                    parts_logs: job.partsLogs,
                    labor_duration: job.laborDuration,
                    notes_logs: job.notesLogs
                };
                if (job.id && !job.id.startsWith('temp-')) {
                    await supabaseClient.from('operations_jobs').update(payload).eq('id', job.id);
                } else {
                    const { data } = await supabaseClient.from('operations_jobs').insert([payload]).select();
                    if (data && data[0]) job.id = data[0].id;
                }
            }
            localStorage.setItem('electrical_os_jobs', JSON.stringify(jobsList));
        }

        async function loadJobs() {
            if (supabaseClient) {
                const { data } = await supabaseClient.from('operations_jobs').select('*');
                if (data) {
                    jobsList = data.map(dbRow => ({
                        id: dbRow.id,
                        name: dbRow.customer_name,
                        phone: dbRow.phone,
                        address: dbRow.address,
                        type: dbRow.type,
                        safetyScore: { total: 4, checked: 0 },
                        safetyChecklist: dbRow.safety_checklist || { ppe: false, loto: false, voltage: false, boundary: false },
                        partsLogs: dbRow.parts_logs || [],
                        laborDuration: dbRow.labor_duration || { h: 0, m: 0 },
                        notesLogs: dbRow.notes_logs || { internal: '', client: '' }
                    }));
                    if (jobsList.length > 0 && selectedActiveJobIndex === null) selectedActiveJobIndex = 0;
                    return;
                }
            }
            const cached = localStorage.getItem('electrical_os_jobs');
            if (cached) {
                jobsList = JSON.parse(cached);
                if (jobsList.length > 0) selectedActiveJobIndex = 0;
            }
        }

        function loadPrefs() {
            const cached = localStorage.getItem('electrical_os_prefs');
            if (cached) preferencesState = { ...preferencesState, ...JSON.parse(cached) };
            initSupabase();
        }

        function savePrefs() {
            localStorage.setItem('electrical_os_prefs', JSON.stringify(preferencesState));
            initSupabase();
        }

        function triggerToast(message, type = 'indigo') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-3 bg-[#0a0f1d] border text-xs font-semibold rounded-xl flex items-center space-x-2.5 ${type === 'emerald' ? 'border-emerald-500/30 text-emerald-400' : 'border-indigo-500/30 text-indigo-400'}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            loadPrefs();
            await loadJobs();
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentTab = btn.getAttribute('data-nav');
                    renderTargetSurfaceView();
                });
            });
            renderTargetSurfaceView();
        });

        function renderTargetSurfaceView() {
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                if (btn.getAttribute('data-nav') === currentTab) {
                    btn.classList.remove('text-slate-500');
                    btn.classList.add('text-indigo-400');
                } else {
                    btn.classList.remove('text-indigo-400');
                    btn.classList.add('text-slate-500');
                }
            });
            const surface = document.getElementById('panel-surface');
            if (!surface) return;
            if (currentTab === 'jobs') renderJobsView(surface);
            if (currentTab === 'active') renderActiveView(surface);
            if (currentTab === 'clients') renderClientsView(surface);
            if (currentTab === 'settings') renderSettingsView(surface);
        }

        function renderSettingsView(container) {
            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-8 animate-in fade-in duration-150">
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">Preferences</h1>
                        <p class="text-xs font-mono text-indigo-400 mt-0.5">V1.0.4 CLOUD CONFIG</p>
                    </div>
                    <div class="bg-[#090d1a] border border-slate-900 rounded-2xl p-5 shadow-xl space-y-4">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400"><i class="fa-solid fa-database mr-1.5"></i>Supabase Credentials</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-slate-500 uppercase tracking-wider mb-1.5 font-bold text-[10px]">Endpoint URL</label>
                                <input type="text" id="pref-sub-url" value="${preferencesState.supabaseUrl}" class="w-full bg-slate-950 border border-slate-900 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="https://xyz.supabase.co">
                            </div>
                            <div>
                                <label class="block text-slate-500 uppercase tracking-wider mb-1.5 font-bold text-[10px]">Public Anon Key</label>
                                <input type="password" id="pref-sub-key" value="${preferencesState.supabaseKey}" class="w-full bg-slate-950 border border-slate-900 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="your-anon-key">
                            </div>
                        </div>
                    </div>
                    <div class="bg-[#090d1a] border border-slate-900 rounded-2xl p-5 shadow-xl space-y-4">
                        <div class="text-xs font-bold tracking-wider uppercase text-slate-400">PostgreSQL RLS & Scoping</div>
                        <div class="grid grid-cols-2 gap-3 text-xs">
                            <button id="tab-scope-alpha" class="p-3 rounded-xl border text-left cursor-pointer transition-all ${preferencesState.tenantScope === 'lead-alpha' ? 'border-indigo-500 bg-indigo-500/5 text-white' : 'border-slate-800 bg-slate-950/40 text-slate-400'}">
                                <p class="font-bold uppercase tracking-wide text-[10px] text-indigo-400">Lead Tech Alpha</p>
                                <p class="font-medium text-xs mt-0.5">Master Electrician</p>
                            </button>
                            <button id="tab-scope-bravo" class="p-3 rounded-xl border text-left cursor-pointer transition-all ${preferencesState.tenantScope === 'sub-bravo' ? 'border-indigo-500 bg-indigo-500/5 text-white' : 'border-slate-800 bg-slate-950/40 text-slate-400'}">
                                <p class="font-bold uppercase tracking-wide text-[10px] text-slate-500">Subcontractor Bravo</p>
                                <p class="font-medium text-xs mt-0.5">Journeyman Electrician</p>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            bindSettingsDOM();
        }

        function bindSettingsDOM() {
            const urlInput = document.getElementById('pref-sub-url');
            const keyInput = document.getElementById('pref-sub-key');
            const handleCredChange = () => {
                preferencesState.supabaseUrl = urlInput.value.trim();
                preferencesState.supabaseKey = keyInput.value.trim();
                savePrefs();
            };
            if (urlInput) urlInput.addEventListener('blur', handleCredChange);
            if (keyInput) keyInput.addEventListener('blur', handleCredChange);

            document.getElementById('tab-scope-alpha').addEventListener('click', () => {
                preferencesState.tenantScope = 'lead-alpha'; savePrefs(); renderTargetSurfaceView(); triggerToast("Switched to Lead Alpha Boundary");
            });
            document.getElementById('tab-scope-bravo').addEventListener('click', () => {
                preferencesState.tenantScope = 'sub-bravo'; savePrefs(); renderTargetSurfaceView(); triggerToast("Switched to Subcontractor Bravo Boundary");
            });
        }

        function renderJobsView(container) {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Jobs</h1>
                            <p class="text-xs text-slate-400 mt-0.5">Manage assignments</p>
                        </div>
                        <button id="btn-trigger-new-job" class="h-10 w-10 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus text-sm"></i></button>
                    </div>
                    <div class="flex space-x-1 bg-[#111827] p-1 rounded-lg border border-slate-800 w-fit">
                        <button id="btn-view-list" class="px-3 py-1 bg-[#1e293b] text-xs font-medium rounded-md text-slate-200">List</button>
                        <button id="btn-view-map" class="px-3 py-1 text-xs font-medium rounded-md text-slate-400">Map</button>
                    </div>
                    <div id="jobs-map-container" class="h-64 rounded-2xl overflow-hidden border border-slate-800 hidden">
                        <div id="leaflet-map" class="h-full w-full"></div>
                    </div>
                    <div id="jobs-list" class="space-y-3">
                        ${jobsList.length === 0 ? `<p class="text-slate-600 text-xs py-4 text-center">No active jobs found. Click + to dispatch.</p>` : renderJobItems()}
                    </div>
                </div>
                <div id="new-job-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
                    <div class="bg-[#0d1222] border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-5">
                        <h3 class="text-md font-bold text-white border-b border-slate-800 pb-3">New Deployment Target</h3>
                        <form id="frm-create-job" class="space-y-4 text-xs font-semibold">
                            <div>
                                <label class="block text-slate-400 uppercase mb-1.5">Customer Name</label>
                                <input type="text" id="job-cust-name" required class="w-full bg-[#030712] border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-slate-400 uppercase mb-1.5">Address</label>
                                <input type="text" id="job-cust-address" required class="w-full bg-[#030712] border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none">
                            </div>
                            <div class="flex gap-3 pt-2">
                                <button type="button" id="btn-cancel-job" class="flex-1 py-3 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                                <button type="submit" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            bindJobsDOM();
        }

        function renderJobItems() {
            return jobsList.map((job, idx) => `
                <div class="bg-[#0a0f1d] border border-slate-900 rounded-xl p-4 flex items-center justify-between hover:border-indigo-500/30 transition-all cursor-pointer btn-select-job-row" data-index="${idx}">
                    <div>
                        <h4 class="text-sm font-semibold text-white">${job.name}</h4>
                        <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-location-dot text-indigo-400/80 mr-1.5"></i>${job.address}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                </div>
            `).join('');
        }

        function bindJobsDOM() {
            const listBtn = document.getElementById('btn-view-list');
            const mapBtn = document.getElementById('btn-view-map');
            const mapCont = document.getElementById('jobs-map-container');
            const listCont = document.getElementById('jobs-list');
            const addBtn = document.getElementById('btn-trigger-new-job');
            const modal = document.getElementById('new-job-modal');
            const cancelBtn = document.getElementById('btn-cancel-job');
            const form = document.getElementById('frm-create-job');

            if (addBtn) addBtn.addEventListener('click', () => modal.classList.remove('hidden'));
            if (cancelBtn) cancelBtn.addEventListener('click', () => modal.classList.add('hidden'));

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const newJob = {
                        id: `temp-${Date.now()}`,
                        name: document.getElementById('job-cust-name').value,
                        address: document.getElementById('job-cust-address').value,
                        phone: '', type: 'Commercial', safetyScore: { total: 4, checked: 0 },
                        safetyChecklist: { ppe: false, loto: false, voltage: false, boundary: false },
                        partsLogs: [], laborDuration: { h: 0, m: 0 }, notesLogs: { internal: '', client: '' }
                    };
                    jobsList.push(newJob);
                    selectedActiveJobIndex = jobsList.length - 1;
                    modal.classList.add('hidden');
                    await saveJob(newJob);
                    triggerToast("Deployment Target Configured", "emerald");
                    currentTab = 'active'; renderTargetSurfaceView();
                });
            }

            document.querySelectorAll('.btn-select-job-row').forEach(row => {
                row.addEventListener('click', () => {
                    selectedActiveJobIndex = parseInt(row.getAttribute('data-index'));
                    currentTab = 'active'; renderTargetSurfaceView();
                });
            });

            let activeMap = null;
            if (mapBtn) {
                mapBtn.addEventListener('click', () => {
                    mapBtn.className = "px-3 py-1 bg-[#1e293b] text-xs font-medium rounded-md text-slate-200";
                    listBtn.className = "px-3 py-1 text-xs font-medium rounded-md text-slate-400";
                    mapCont.classList.remove('hidden'); listCont.classList.add('hidden');
                    setTimeout(() => {
                        if (!activeMap) {
                            activeMap = L.map('leaflet-map').setView([35.7796, -78.6382], 12);
                            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(activeMap);
                            L.marker([35.7796, -78.6382]).addTo(activeMap).bindPopup('<div class="text-slate-900 text-xs font-bold">Candor Site</div>').openPopup();
                        } else { activeMap.invalidateSize(); }
                    }, 100);
                });
            }
            if (listBtn) {
                listBtn.addEventListener('click', () => {
                    listBtn.className = "px-3 py-1 bg-[#1e293b] text-xs font-medium rounded-md text-slate-200";
                    mapBtn.className = "px-3 py-1 text-xs font-medium rounded-md text-slate-400";
                    mapCont.classList.add('hidden'); listCont.classList.remove('hidden');
                });
            }
        }

        function renderActiveView(container) {
            const job = jobsList[selectedActiveJobIndex];
            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6 animate-in fade-in duration-150">
                    <div class="bg-[#090d1a] border border-slate-900 rounded-2xl p-4 flex justify-between items-center shadow-xl">
                        <div><span class="text-xs font-semibold text-slate-400">ACTIVE WORKSPACE</span><div class="text-lg font-bold text-white">${job.name}</div></div>
                    </div>
                    <div class="flex border-b border-slate-900 overflow-x-auto gap-1" id="sub-active-tabs">
                        <button data-sub="diagnostics" class="px-4 py-2.5 text-xs font-bold tracking-wider uppercase border-b-2 ${currentActiveSubTab === 'diagnostics' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}">Diagnostics</button>
                        <button data-sub="safety" class="px-4 py-2.5 text-xs font-bold tracking-wider uppercase border-b-2 ${currentActiveSubTab === 'safety' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}">Safety</button>
                    </div>
                    <div id="sub-active-canvas" class="mt-4"></div>
                </div>
            `;
            document.querySelectorAll('#sub-active-tabs button').forEach(btn => {
                btn.addEventListener('click', () => { currentActiveSubTab = btn.getAttribute('data-sub'); renderTargetSurfaceView(); });
            });
            renderActiveSubTabContent(job);
        }

        function renderActiveSubTabContent(job) {
            const canvas = document.getElementById('sub-active-canvas');
            if (!canvas) return;

            if (currentActiveSubTab === 'diagnostics') {
                canvas.innerHTML = `
                    <div class="space-y-6 max-w-4xl">
                        <div class="bg-[#090d1a] border border-slate-900 rounded-2xl p-5 shadow-xl">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4">AI Diagnostic Analysis Terminal</h3>
                            <textarea id="txt-diagnostic-query" rows="3" class="w-full bg-[#030712] border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Input breaker codes..."></textarea>
                            <button id="btn-run-diag" class="w-full mt-4 py-3 bg-indigo-600 text-xs font-bold uppercase tracking-wider rounded-xl text-white">Execute Secure Analysis</button>
                        </div>
                        <div id="ai-response-block" class="bg-[#090d1a] border border-slate-900 rounded-2xl p-5 shadow-xl hidden">
                            <div class="text-xs font-mono text-slate-300 leading-relaxed" id="ai-response-injection-point"></div>
                        </div>
                    </div>
                `;
                document.getElementById('btn-run-diag').addEventListener('click', async () => {
                    const query = document.getElementById('txt-diagnostic-query').value.trim();
                    if (!query) return;
                    const submitBtn = document.getElementById('btn-run-diag');
                    submitBtn.disabled = true; submitBtn.textContent = "Connecting Secure Proxy Node...";
                    try {
                        const response = await fetch('/api/analyze', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: query, tone: preferencesState.assistantTone })
                        });
                        const data = await response.json();
                        document.getElementById('ai-response-block').classList.remove('hidden');
                        const injection = document.getElementById('ai-response-injection-point');
                        if (data.success) {
                            injection.innerHTML = `<p class="text-indigo-400 font-bold uppercase tracking-wider">// RESPONSE MATRIX (gemini-1.5-flash)</p><div class="mt-4 space-y-4 font-sans text-slate-300 text-xs">${data.payload}</div>`;
                        } else { injection.innerHTML = `<p class="text-red-400">Error: ${data.error}</p>`; }
                    } catch (e) {
                        document.getElementById('ai-response-block').classList.remove('hidden');
                        document.getElementById('ai-response-injection-point').innerHTML = `<p class="text-red-400">Edge network connection failure.</p>`;
                    } finally { submitBtn.disabled = false; submitBtn.textContent = "Execute Secure Analysis"; }
                });
            } else if (currentActiveSubTab === 'safety') {
                canvas.innerHTML = `
                    <div class="bg-[#090d1a] border border-slate-900 rounded-2xl p-5 shadow-xl max-w-xl space-y-5">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300">Compliance Scorecard</h3>
                        <div class="space-y-2 text-xs font-semibold">
                            <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer">
                                <span class="text-slate-300">PPE Safety Wear Verified</span>
                                <input type="checkbox" class="chk-safety-metric h-4 w-4" data-field="ppe" ${job.safetyChecklist.ppe ? 'checked' : ''}>
                            </label>
                        </div>
                    </div>
                `;
                document.querySelectorAll('.chk-safety-metric').forEach(chk => {
                    chk.addEventListener('change', async () => {
                        job.safetyChecklist.ppe = chk.checked; job.safetyScore.checked = chk.checked ? 1 : 0;
                        await saveJob(job); renderActiveView(document.getElementById('panel-surface'));
                    });
                });
            }
        }

        function renderClientsView(container) {
            container.innerHTML = `<div class="max-w-5xl mx-auto space-y-6"><h1 class="text-2xl font-bold text-white tracking-tight">Clients</h1><div class="bg-[#0a0f1d] border border-slate-900 rounded-xl p-4"><h4 class="text-sm font-semibold text-white">Candor Properties</h4></div></div>`;
        }
    </script>
</body>
</html>
